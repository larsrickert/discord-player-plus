name: Check code quality
on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🔎 Lint
        run: pnpm lint

      - name: 🔎 Check formatting
        run: pnpm format:check

      - name: 🚨 Run tests
        run: pnpm test

      - name: ⚒️ Build
        run: pnpm build

      - name: 🔎 Publint
        run: npx publint

      - name: ⚒️ Build docs
        run: pnpm docs:build

  check_example_bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: example/.node-version
          cache: pnpm
          cache-dependency-path: example/pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install

      - name: ⚒️ Build
        run: pnpm build
